name: Update Contribution Wave

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:       # allow manual trigger

jobs:
  update-wave:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution wave SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python .github/scripts/generate_wave.py \
            --username Urvity03 \
            --token "$GH_TOKEN" \
            --output assets/github-contribution-wave.svg

      - name: Commit and push if changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add assets/github-contribution-wave.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution wave [skip ci]"
            git push
          fi
